version: "1"

services:
  broker-service:
    build:
      context: ./../broker-service
      dockerfile: broker-service.dockerfile
    ports:
      - "8080:80"
    restart: always

  postgres:
    image: postgres:14
    ports:
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: 111
      POSTGRES_USER: postgres
      POSTGRES_DB: users
    volumes:
      - "./db-data/postgres:/var/lib/postgresql/data"

  authentication-service:
    build:
      context: ./../authentication-service
      dockerfile: authentication-service.dockerfile
    ports:
      - "8081:80"
    restart: always
    environment:
      WaitTimeInSecondEnv: 5
      RepeatTime: 10
      DSN: "host=postgres port=5432 user=postgres password=111 dbname=users sslmode=disable connect_timeout=5"
